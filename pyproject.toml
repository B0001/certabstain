[project]
name = "certabstain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
]

# This repo directory is itself the `certabstain` package -- there is an
# __init__.py at the root and imports resolve as `certabstain.vnnlib` with the
# parent directory on the path. Without this, setuptools' flat-layout discovery
# sees `artifacts/` and `k8s/` as competing top-level packages and refuses to
# build at all. Naming the one real package excludes them.
[tool.setuptools]
packages = ["certabstain"]
package-dir = { certabstain = "." }

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "mpmath>=1.4.1",
    "onnx>=1.22",
    "onnxruntime>=1.28",
    "pytest>=9.1.1",
    "scipy>=1.15.3",
]
