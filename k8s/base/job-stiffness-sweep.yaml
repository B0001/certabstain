apiVersion: batch/v1
kind: Job
metadata:
  name: certabstain-stiffness-sweep
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sweep
          image: certabstain:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["-m", "certabstain.stiffness_sweep"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - name: artifacts
              mountPath: /app/certabstain/artifacts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: certabstain-artifacts
        - name: tmp
          emptyDir: {}
